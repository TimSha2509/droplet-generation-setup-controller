experiment_id: TEST_CAMERA
nozzle_id: 2.5mm_A

vibrometer:
  factor_um_per_v: 5120

sweep:
  speeds_rpm:     [200]
  frequencies_hz: [3.0, 6.0, 30.0]
  amplitudes_vpp: [2.0, 3.0, 4.0]
  hold_s: 100
  random: false

timing:
  stabilization_rpm_change_s: 10
  stabilization_freq_change_s: 0.5
  stabilization_amp_change_s: 0.5
  image_interval_s: 2 #Currently set to continuus trigger via arduino.py, so this might have no effect.
  camera_latency_tolerance_s: 5
  wait_time_camera: 0.0

limits:
  max_speed_rpm: 1600

devices:
  pump:
    port: COM10
    baudrate: 9600
  oscilloscope:
    visa_resource: "USB0::0x2A8D::0x1778::MY55440264::0::INSTR"
  camera:
    digicam_url: "http://localhost:5513"
    trigger_backend: arduino
    shutter_port: COM3
    shutter_baudrate: 9600
    shutter_pulse_ms: 300
  function_generator:
    port: COM6
    channel: 1
  scale:
    enabled: true
    port: COM4
    baudrate: 1200
    interval_s: 5

output:
  base_dir: ./DATA  # overridden in tests via output_dir
