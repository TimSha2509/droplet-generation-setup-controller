# Reference experiment. Copy and edit for new runs.
experiment_id: HPMC_Test_01
nozzle_id: 1mm_A

vibrometer:
  factor_um_per_v: 5280

# Full cross product is fired in order unless random is set to true.
sweep:
  speeds_rpm:     [150, 400]
  frequencies_hz: [6, 10]
  amplitudes_vpp: [1.0, 3.0]
  hold_s: 300                          # per combination
  random: false                         # true = deterministic Fisher-Yates shuffled order

timing:
  stabilization_rpm_change_s: 10
  stabilization_freq_change_s: 2
  stabilization_amp_change_s: 2
  image_interval_s: 5
  camera_latency_tolerance_s: 1.0
  wait_time_camera: 0.0

limits:
  max_speed_rpm: 1000

devices:
  pump:
    port: COM3
    baudrate: 9600
  oscilloscope:
    visa_resource: "USB0::0x2A8D::0x1778::MY55440264::0::INSTR"
  camera:
    digicam_url: "http://localhost:5513"
  function_generator:
    port: COM4
    channel: 1
    baudrate: 115200
  scale:
    enabled: true
    baudrate: 1200
    interval_s: 5

output:
  base_dir: 'W:\PROMOTION_SHARIFSOLTANI_VERKAPSELUNG_DFG_TH1817_9_1_MT\PYTHON\Project_files\DATA'
