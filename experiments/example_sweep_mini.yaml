experiment_id: 260612_Glycerol_90_IE
nozzle_id: 2.5mm_A

vibrometer:
  factor_um_per_v: 5120

sweep:
  speeds_rpm:     [1125, 1175, 1225]
  frequencies_hz: [5.0, 5.5, 6.0, 6.5, 7.0, 7.5]
  amplitudes_vpp: [8.0]
  hold_s: 120

timing:
  stabilization_rpm_change_s: 10
  stabilization_freq_change_s: 0.5
  stabilization_amp_change_s: 0.5
  image_interval_s: 0.5
  camera_latency_tolerance_s: 0.1

limits:
  max_speed_rpm: 1600

devices:
  pump:
    port: COM3
    baudrate: 9600
  oscilloscope:
    visa_resource: "USB0::0x2A8D::0x1778::MY55440264::0::INSTR"
  camera:
    digicam_url: "http://localhost:5513"
  function_generator:
    port: COM6
    channel: 1
  scale:
    enabled: true
    port: COM4
    baudrate: 1200
    interval_s: 5

output:
  base_dir: ./DATA  # overridden in tests via output_dir
