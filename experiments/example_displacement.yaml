experiment_id: TEST_DoE_Timestamp_Glycerol_90
nozzle_id: 2.5mm_A

vibrometer:
  factor_um_per_v: 5120

sweep:
  speeds_rpm: [1125]
  frequencies_hz: [3.0, 6.0, 10.0]
  displacements_um: [2600.0, 2800,3000]
  hold_s: 20
  random: false

displacement:
  model_path: ./DATA/displacement_calibration.json
  max_voltage_table_path: W:\PROMOTION_SHARIFSOLTANI_VERKAPSELUNG_DFG_TH1817_9_1_MT\VIBROMETER\CALIBRATION_V2\MaxDisplacement_init.csv
  amplifier_gain: 2.0
  calibration_start_hz: 3.0
  calibration_stop_hz: 30.0
  calibration_step_hz: 2.0
  voltage_steps: 3
  measurement_s: 10.0
  scope_interval_s: 0.5
  validation_enabled: true
  validation_threshold_percent: 10.0

timing:
  stabilization_rpm_change_s: 10
  stabilization_freq_change_s: 0.5
  stabilization_amp_change_s: 0.5
  image_interval_s: 0.5
  camera_latency_tolerance_s: 0.1
  wait_time_camera: 0.0

limits:
  max_speed_rpm: 1600

devices:
  pump:
    port: COM3
    baudrate: 9600
  oscilloscope:
    visa_resource: "USB0::0x2A8D::0x1778::MY55440264::0::INSTR"
  camera:
    digicam_url: "http://localhost:5513"
    trigger_backend: arduino
    shutter_port: COM8
    shutter_baudrate: 9600
    shutter_pulse_ms: 300
  function_generator:
    port: COM7
    channel: 1
  scale:
    enabled: true
    port: COM4
    baudrate: 1200
    interval_s: 5

output:
  base_dir: ./DATA
