experiment_id: displacement_example
nozzle_id: 2.5mm_A

vibrometer:
  factor_um_per_v: 5120

sweep:
  speeds_rpm: [1125, 1175]
  frequencies_hz: [10.0, 20.0, 30.0]
  displacements_um: [1000.0, 1500.0]
  hold_s: 120
  random: false

displacement:
  model_path: ./DATA/displacement_calibration.json
  max_voltage_table_path: W:\PROMOTION_SHARIFSOLTANI_VERKAPSELUNG_DFG_TH1817_9_1_MT\VIBROMETER\CALIBRATION_V2
  amplifier_gain: 2.0
  calibration_start_hz: 10.0
  calibration_stop_hz: 120.0
  calibration_step_hz: 10.0
  voltage_steps: 5
  measurement_s: 10.0
  scope_interval_s: 0.5
  validation_enabled: true
  validation_threshold_percent: 10.0

timing:
  stabilization_rpm_change_s: 10
  stabilization_freq_change_s: 0.5
  stabilization_amp_change_s: 0.5
  image_interval_s: 0.5
  camera_latency_tolerance_s: 0.1
  wait_time_camera: 0.0

limits:
  max_speed_rpm: 1600

devices:
  pump:
    port: COM3
    baudrate: 9600
  oscilloscope:
    visa_resource: "USB0::0x2A8D::0x1778::MY55440264::0::INSTR"
  camera:
    digicam_url: "http://localhost:5513"
  function_generator:
    port: COM6
    channel: 1
  scale:
    enabled: true
    port: COM4
    baudrate: 1200
    interval_s: 5

output:
  base_dir: ./DATA
